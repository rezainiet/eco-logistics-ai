# ConfirmX — Nginx reverse proxy (VPS). Install as /etc/nginx/sites-available/confirmx.conf
#
# Public traffic enters ONLY on 80/443. The Node services listen on 127.0.0.1:
#   web   127.0.0.1:3001   (app.confirmx.ai)
#   api   127.0.0.1:4000   (api.confirmx.ai)
#   sites 127.0.0.1:3002   (landing pages — NOT routed until the DOMAIN + WILDCARD DNS phase)
# Asterisk is independent of Nginx: SIP 5060/5061 and RTP go straight to Asterisk.
#
# TLS: certificates are issued with certbot (webroot) BEFORE DNS moves by using
# the DNS-01 challenge, or AFTER cutover with HTTP-01. See docs/infra/MIGRATION-PLAN.md.
# Staging hostnames (e.g. app-vps.confirmx.ai / api-vps.confirmx.ai) use the same blocks.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Real client IP for the API's fraud/audit/rate-limit logic comes from
# X-Forwarded-For; the API trusts only loopback (TRUSTED_PROXIES=loopback).

upstream confirmx_web   { server 127.0.0.1:3001; keepalive 16; }
upstream confirmx_api   { server 127.0.0.1:4000; keepalive 16; }
# upstream confirmx_sites { server 127.0.0.1:3002; keepalive 16; }   # DOMAIN phase

# ── HTTP → HTTPS (+ ACME) ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name app.confirmx.ai api.confirmx.ai;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── Dashboard ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.confirmx.ai;

    ssl_certificate     /etc/letsencrypt/live/app.confirmx.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.confirmx.ai/privkey.pem;
    include /etc/nginx/snippets/confirmx-tls.conf;

    client_max_body_size 2m;

    location / {
        proxy_pass http://confirmx_web;
        include /etc/nginx/snippets/confirmx-proxy.conf;
    }
}

# ── API ──────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.confirmx.ai;

    ssl_certificate     /etc/letsencrypt/live/api.confirmx.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.confirmx.ai/privkey.pem;
    include /etc/nginx/snippets/confirmx-tls.conf;

    # express.json caps bodies at 1 MB; landing uploads are ≤ 2 MB data URLs.
    client_max_body_size 3m;

    location / {
        proxy_pass http://confirmx_api;
        include /etc/nginx/snippets/confirmx-proxy.conf;
        # Webhooks + long provider calls
        proxy_read_timeout 60s;
    }
}

