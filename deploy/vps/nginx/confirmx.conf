# ConfirmX — Nginx reverse proxy (VPS). Install as /etc/nginx/sites-available/confirmx.conf
#
# Public traffic enters ONLY on 80/443. The Node services listen on 127.0.0.1:
#   web   127.0.0.1:3001   confirmx.ai + www (marketing pages only), app.confirmx.ai (dashboard)
#   api   127.0.0.1:4000   api.confirmx.ai            (api.env: API_HOST=127.0.0.1)
#   sites 127.0.0.1:3002   *.confirmx.ai merchant landing pages + preview.confirmx.ai
# Asterisk is independent of Nginx: SIP 5060/5061 and RTP go straight to Asterisk.
#
# Written for Nginx 1.24 (Ubuntu 24.04): HTTP/2 is enabled on the `listen` line —
# the `http2 on;` directive only exists from 1.25.1.
#
# TLS: certbot --webroot (HTTP-01) for confirmx.ai/www, app and api; the landing
# wildcard *.confirmx.ai needs DNS-01. The HTTPS landing block stays disabled
# until that certificate really exists. See docs/infra/MIGRATION-PLAN.md.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream confirmx_web   { server 127.0.0.1:3001; keepalive 16; }
upstream confirmx_api   { server 127.0.0.1:4000; keepalive 16; }
upstream confirmx_sites { server 127.0.0.1:3002; keepalive 16; }

# ── Unknown hosts / bare IP: drop ────────────────────────────────────────────
# (Future custom merchant domains will be routed to confirmx_sites here.)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 444; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# ── Known ConfirmX hosts on HTTP: ACME + redirect to HTTPS ───────────────────
server {
    listen 80;
    listen [::]:80;
    server_name confirmx.ai www.confirmx.ai app.confirmx.ai api.confirmx.ai preview.confirmx.ai;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── Merchant landing pages on HTTP ───────────────────────────────────────────
# Landing pages (with checkout) are never served over plain HTTP. Until the
# wildcard certificate exists they answer 503; afterwards replace the 503 with
# `return 301 https://$host$request_uri;` and enable the HTTPS block below.
server {
    listen 80;
    listen [::]:80;
    server_name *.confirmx.ai;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / {
        default_type text/plain;
        return 503 "This page is not available yet.\n";
    }
}

# ── Marketing: confirmx.ai + www ─────────────────────────────────────────────
# Only the public marketing pages are served here; every app path goes to
# app.confirmx.ai, so sessions/cookies are only ever set on the app host.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name confirmx.ai www.confirmx.ai;

    ssl_certificate     /etc/letsencrypt/live/confirmx.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/confirmx.ai/privkey.pem;
    include /etc/nginx/snippets/confirmx-tls.conf;

    client_max_body_size 1m;

    location = / {
        proxy_pass http://confirmx_web;
        include /etc/nginx/snippets/confirmx-proxy.conf;
    }
    location ^~ /_next/ {
        proxy_pass http://confirmx_web;
        include /etc/nginx/snippets/confirmx-proxy.conf;
    }
    location ~ ^/(pricing|legal)(/|$) {
        proxy_pass http://confirmx_web;
        include /etc/nginx/snippets/confirmx-proxy.conf;
    }
    location ~ ^/(robots\.txt|sitemap\.xml|icon\.svg|favicon\.ico)$ {
        proxy_pass http://confirmx_web;
        include /etc/nginx/snippets/confirmx-proxy.conf;
    }
    location / {
        return 301 https://app.confirmx.ai$request_uri;
    }
}

# ── Dashboard ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.confirmx.ai;

    ssl_certificate     /etc/letsencrypt/live/app.confirmx.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.confirmx.ai/privkey.pem;
    include /etc/nginx/snippets/confirmx-tls.conf;

    client_max_body_size 2m;

    location / {
        proxy_pass http://confirmx_web;
        include /etc/nginx/snippets/confirmx-proxy.conf;
    }
}

# ── API ──────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.confirmx.ai;

    ssl_certificate     /etc/letsencrypt/live/api.confirmx.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.confirmx.ai/privkey.pem;
    include /etc/nginx/snippets/confirmx-tls.conf;

    # express.json caps bodies at 1 MB; landing uploads are ≤ 2 MB data URLs.
    client_max_body_size 3m;

    location / {
        proxy_pass http://confirmx_api;
        # Webhooks + long provider calls: 60 s read timeout (set in the snippet).
        include /etc/nginx/snippets/confirmx-proxy.conf;
    }
}

# ── Editor preview frame (Sites) ─────────────────────────────────────────────
# Own certificate (HTTP-01), so it works before the landing wildcard exists.
# Only framed by the dashboard (CSP frame-ancestors = LANDING_EDITOR_ORIGINS).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name preview.confirmx.ai;

    ssl_certificate     /etc/letsencrypt/live/preview.confirmx.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.confirmx.ai/privkey.pem;
    include /etc/nginx/snippets/confirmx-tls.conf;

    client_max_body_size 64k;

    location / {
        proxy_pass http://confirmx_sites;
        include /etc/nginx/snippets/confirmx-proxy-sites.conf;
    }
}

