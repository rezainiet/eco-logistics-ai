# /etc/nginx/snippets/confirmx-proxy-sites.conf — landing pages (confirmx_sites).
# Same as confirmx-proxy.conf, except X-Forwarded-For carries ONLY the real
# client address: the checkout proxy (apps/sites /api/checkout) takes the first
# X-Forwarded-For entry as the customer IP (rate limits, fraud signals), so a
# client-supplied X-Forwarded-For must never be appended to.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
proxy_buffering       on;
# HSTS is set once, by Nginx (confirmx-tls.conf).
proxy_hide_header Strict-Transport-Security;
