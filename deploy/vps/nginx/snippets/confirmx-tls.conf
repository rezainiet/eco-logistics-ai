# /etc/nginx/snippets/confirmx-tls.conf
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:confirmx_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
# HSTS — the ONLY Strict-Transport-Security header (the proxy snippets hide the
# apps' own copies, which differ). includeSubDomains is intentional: every
# *.confirmx.ai host is HTTPS-only — explicit certificates for www/app/api/preview
# and the auto-renewed wildcard certificate (DNS-01) for merchant landing pages.
# Never serve a confirmx.ai subdomain without a valid certificate.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
