# /etc/nginx/snippets/confirmx-tls.conf
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:confirmx_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
# HSTS — the ONLY Strict-Transport-Security header (the proxy snippets hide the
# apps' own copies, which differ). includeSubDomains is intentionally NOT sent
# until *.confirmx.ai (merchant landing pages) has a valid wildcard certificate:
# with it, browsers would refuse every landing page that isn't on HTTPS yet.
# Once the wildcard certificate is live, change to:
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Strict-Transport-Security "max-age=31536000" always;
